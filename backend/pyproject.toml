[project]
name = "alfa-pulse-backend"
version = "1.1.0"
description = "Personalized business analytics API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.38,<1",
  "sqlalchemy[asyncio]>=2.0.44,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.12,<3",
  "pyjwt>=2.10.1,<3",
  "pwdlib[argon2]>=0.3,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "jsonschema>=4.25,<5",
  "pypdf>=6,<7",
  "defusedxml>=0.7.1,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1", "pyyaml>=6,<7", "openapi-spec-validator>=0.7,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]
