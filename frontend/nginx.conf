server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 151m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-cache;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/v1/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://pulse-api:8000;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }
    location = /healthz {
        access_log off;
        return 200 'ok';
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
